<title>ミサト&タイガ ウェディングクイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* ウェディング雑誌のような、白とベビーピンクの明るい誌面。
   丸い札、ピンクの押しボタン、パステルの選択肢。背景には花びらと金のきらめきが舞い、上には真珠の飾りが光る。
   文字は筆記体(見出し)と丸ゴシック(それ以外)の2種類だけ。
   明暗どちらの設定でも同じ見た目にする(意図して1つの世界に決めている)。 */
:root {
  --bg: #fff6f9;
  --bg-2: #ffe6ee;
  --paper: #ffffff;
  --ink: #4a3340;
  --muted: #7d6772;
  --line: #f6d5e0;
  --pink: #ff6b9a;
  --pink-deep: #e03a78;
  --pink-text: #c42f66;
  --pink-soft: #ffe3ec;
  --gold: #d9a441;
  --gold-hi: #f6d98a;
  --gold-lo: #b8842a;
  --rosegold: #d9a15c;
  --mint: #2fae8c;   --mint-soft: #d9f5ec;
  --sun: #e9a21f;    --sun-soft: #fff0c6;
  --sky: #3d92dc;    --sky-soft: #dcedff;
  --silver: #a9a3b0;
  --petal1: #ffb3c8; --petal2: #ff9ab8; --petal3: #ffd0dc; --petal4: #f6cf9a;
  --spark: #e5ae4f;
  --bokeh-rgb: 255, 150, 185;
  --pink-grad: linear-gradient(135deg, #f7578f, #e03a78);
  --font-script: "Pinyon Script", "Snell Roundhand", cursive;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 38% at 12% -4%, rgba(255, 170, 200, .5), transparent 70%),
    radial-gradient(ellipse 70% 40% at 100% 20%, rgba(255, 220, 160, .35), transparent 70%),
    radial-gradient(ellipse 90% 40% at 50% 108%, rgba(255, 150, 185, .4), transparent 70%);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); font-weight: 500; font-size: 16px; line-height: 1.7;
  min-height: 100%;
  padding-block: 20px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p { margin: 0; }
h2, h3 { text-wrap: balance; line-height: 1.45; }
#petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* ---- ヒーロー ---- */
.hero { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding-top: 2px; }
.eyebrow { font-weight: 900; font-size: 12px; letter-spacing: .5em; text-indent: .5em; color: var(--pink-text); }
.names { margin: 0; font-family: var(--font-script); font-weight: 400; font-size: clamp(60px, 19vw, 104px); line-height: 1.02;
  display: flex; flex-direction: column; align-items: center; }
.names span { white-space: nowrap; padding: 0 .1em .08em;
  background: linear-gradient(100deg, #cf2a68 0%, #ee5088 24%, #c98440 46%, #ee5088 70%, #cf2a68 100%); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 6px rgba(224, 58, 120, .22)); }
.names span:first-child { transform: translateX(-.45em); }
.names span:last-child { transform: translateX(.4em); }
@media (min-width: 640px) {
  .names { flex-direction: row; column-gap: .25em; align-items: baseline; font-size: 88px; }
  .names span:first-child, .names span:last-child { transform: none; }
}
.orn { display: flex; align-items: center; gap: 12px; width: min(340px, 80%); margin-top: 2px; }
.orn svg { flex: none; filter: drop-shadow(0 0 5px rgba(217, 164, 65, .5)); }
.orn::before, .orn::after { content: ""; flex: 1; height: 1.5px; background: linear-gradient(90deg, transparent, var(--rosegold)); }
.orn::after { background: linear-gradient(270deg, transparent, var(--rosegold)); }
.lights { width: min(100%, 520px); height: auto; margin-bottom: 2px; }
.lights path { stroke: rgba(217, 161, 92, .75); }
.lights g circle { fill: #ffffff; stroke: var(--rosegold); stroke-width: 1; filter: drop-shadow(0 0 4px rgba(255, 120, 165, .7)); }
.tagline { font-weight: 900; font-size: 16px; letter-spacing: .06em; margin-top: 6px; text-wrap: balance; }
.status { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.chip { font-weight: 900; font-size: 13px; letter-spacing: .06em; padding: 4px 16px; border-radius: 99px; background: var(--pink-soft); color: var(--pink-text); white-space: nowrap; }
.who { color: var(--muted); font-size: 14px; }
.hearts { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; font-size: 20px; line-height: 1.2; margin-top: 4px; max-width: 100%; }
.hearts span { color: #e8bccb; }
.hearts span.lit { color: var(--pink); text-shadow: 0 0 10px rgba(255, 107, 154, .55); }
.hearts span.cur { color: var(--pink-deep); text-shadow: 0 0 14px rgba(224, 58, 120, .7); }

/* ---- 札(カード) ---- */
.card { position: relative; background: var(--paper); color: var(--ink); border-radius: 22px; padding: 22px 20px;
  box-shadow: 0 12px 30px rgba(224, 58, 120, .15), 0 2px 6px rgba(74, 51, 64, .06); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-weight: 900; font-size: 20px; letter-spacing: .04em; border-left: 5px solid var(--pink); padding-left: 10px; }
.card h3 { font-weight: 900; font-size: 16px; letter-spacing: .04em; }
.hint { color: var(--muted); font-size: 14px; }
.warn { background: var(--pink-soft); color: var(--pink-text); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
.stat { display: flex; justify-content: center; gap: 30px; align-items: baseline; color: var(--muted); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat b { font-weight: 900; color: var(--pink-deep); font-size: 42px; line-height: 1; margin: 0 6px; }
.stat.sm b { font-size: 28px; }

/* ---- 入力 ---- */
.f { font-weight: 900; font-size: 14px; letter-spacing: .04em; display: block; margin-bottom: 6px; }
textarea, input[type="text"] { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fffafb; border: 2px solid #f4c8d6; border-radius: 14px; padding: 10px 14px; min-height: 48px; }
textarea { resize: vertical; min-height: 92px; }
::placeholder { color: var(--muted); opacity: .6; }
textarea:focus, input[type="text"]:focus { outline: 3px solid rgba(255, 107, 154, .45); outline-offset: 0; border-color: var(--pink); }
button:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 3px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.optrow { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: center; }
.radio { position: relative; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; border: 2px dashed #eaa3bb; cursor: pointer; font-weight: 900; font-size: 13px; color: var(--pink-text); }
.radio input { position: absolute; opacity: 0; pointer-events: none; }
.radio:has(input:checked) { background: var(--pink-grad); border: 2px solid var(--pink-deep); color: #ffffff; }
.radio:has(input:focus-visible) { outline: 3px solid var(--pink-deep); outline-offset: 2px; }

/* ---- ボタン ---- */
button { font: inherit; cursor: pointer; }
.btn { font-weight: 900; font-size: 17px; letter-spacing: .08em; min-height: 56px; padding: 0 24px; border-radius: 99px;
  border: 2px solid var(--pink); background: var(--paper); color: var(--pink-text); box-shadow: 0 4px 0 #f4bfd0; }
.btn.primary { background: var(--pink-grad); color: #ffffff; border-color: transparent; box-shadow: 0 5px 0 #b02a60, 0 12px 20px rgba(224, 58, 120, .28); }
.btn.danger { color: var(--pink-text); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; letter-spacing: .04em; white-space: nowrap; flex-shrink: 0; box-shadow: 0 2px 0 #f4bfd0; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #f4bfd0; }
.btn.primary:active:not(:disabled) { box-shadow: 0 2px 0 #b02a60; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1.5px dashed var(--line); padding: 6px 0 12px; min-width: 0; }
.item:last-child { border-bottom: 0; padding-bottom: 0; }
.item .t { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.item small { color: var(--muted); display: block; font-weight: 500; }

/* ---- 出題 ---- */
.qhead { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.qno { font-family: var(--font-script); font-size: clamp(44px, 12vw, 68px); line-height: 1.1; color: var(--pink-deep); text-shadow: 0 2px 0 #ffffff, 0 4px 14px rgba(224, 58, 120, .25); }
.qno::before, .qno::after { content: "✦"; font-family: var(--font-body); font-size: .32em; vertical-align: .9em; color: var(--gold); margin-inline: .5em; }
.qno small { font-family: var(--font-body); font-weight: 700; font-size: 14px; color: var(--muted); margin-left: 10px; text-shadow: none; letter-spacing: .08em; }
.by { font-size: 14px; font-weight: 700; color: var(--muted); overflow-wrap: anywhere; }
.qcard { padding-block: 30px; text-align: center; }
.qtext { font-weight: 900; font-size: clamp(22px, 4vw, 34px); line-height: 1.6; overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .opts { grid-template-columns: 1fr 1fr; } }
.opt { --c: var(--pink-soft); --cb: #f0558a; --on-cb: #ffffff; position: relative; display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; text-align: left; width: 100%; min-width: 0;
  min-height: 72px; padding: 10px 16px 10px 12px; border-radius: 20px; border: 2px solid var(--cb); background: var(--c); color: var(--ink);
  font-weight: 900; font-size: clamp(17px, 2.4vw, 21px); line-height: 1.45; box-shadow: 0 8px 18px rgba(224, 58, 120, .14); }
.opt[data-i="1"] { --c: var(--mint-soft); --cb: var(--mint); }
.opt[data-i="2"] { --c: var(--sun-soft); --cb: var(--sun); --on-cb: var(--ink); }
.opt[data-i="3"] { --c: var(--sky-soft); --cb: var(--sky); }
.opt .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--cb); color: var(--on-cb); font-weight: 900; font-size: 20px; line-height: 1; }
.opt .label { overflow-wrap: anywhere; min-width: 0; }
.opt .side { display: flex; align-items: center; gap: 6px; }
.tag { font-size: 12px; font-weight: 900; background: var(--paper); color: var(--ink); border: 1.5px solid var(--cb, var(--pink)); border-radius: 99px; padding: 1px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stamp { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--pink-grad); color: #ffffff; border: 2px solid #ffffff; font-weight: 900; font-size: 14px; box-shadow: 0 0 0 3px var(--gold), 0 0 16px 3px rgba(246, 217, 138, .9); transform: rotate(-10deg); }
.opt.open:active { transform: translateY(3px); box-shadow: 0 3px 8px rgba(224, 58, 120, .14); }
.opt.locked { cursor: default; }
.opt.dim { opacity: .5; box-shadow: none; }
.opt.chosen { outline: 3px solid var(--pink-deep); outline-offset: 3px; }
.opt.right { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-hi), 0 0 26px 6px rgba(246, 217, 138, .85); }
.verdict { font-weight: 900; font-size: 15px; padding: 12px 16px; border-radius: 18px; text-align: center; letter-spacing: .04em; }
.verdict.na { background: rgba(255, 255, 255, .7); color: var(--ink); border: 2px dashed #eaa3bb; }
.verdict.ok { background: linear-gradient(100deg, #e03a78, #ff7fa8 35%, #f6a35e 55%, #ff7fa8 80%, #e03a78); color: #ffffff; box-shadow: 0 10px 26px rgba(224, 58, 120, .4); font-family: var(--font-script); font-weight: 400; font-size: 48px; line-height: 1.2; padding-block: 6px 10px; text-shadow: 0 2px 6px rgba(120, 20, 60, .35); }
.verdict.ng { background: var(--paper); color: var(--pink-text); border: 2px solid var(--pink); font-size: 17px; }
.winners { display: flex; flex-wrap: wrap; gap: 6px; }
.winners span { background: var(--pink-soft); color: var(--pink-text); border-radius: 99px; padding: 2px 12px; font-size: 14px; font-weight: 900; overflow-wrap: anywhere; }

/* ---- 司会 ---- */
.host { border: 2px dashed #eaa3bb; background: rgba(255, 255, 255, .65); border-radius: 22px; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.host .lbl { font-size: 12px; font-weight: 900; color: var(--pink-text); letter-spacing: .3em; }
.host .btns { display: flex; gap: 12px; flex-wrap: wrap; }
.host .btns .btn { flex: 1 1 180px; }
.wait { color: var(--muted); font-size: 14px; text-align: center; }

/* ---- 結果 ---- */
.final-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0; }
.final-title { font-family: var(--font-script); font-weight: 400; font-size: clamp(54px, 16vw, 88px); line-height: 1.1; color: var(--pink-deep); text-shadow: 0 2px 0 #ffffff, 0 6px 18px rgba(224, 58, 120, .28); }
.mine { text-align: center; font-weight: 900; }
.mine b { font-weight: 900; color: var(--pink-deep); font-size: 32px; margin: 0 6px; }
.ranks { display: flex; flex-direction: column; gap: 10px; }
.rank { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 10px 18px 10px 10px; border-radius: 18px; background: var(--paper); color: var(--ink); box-shadow: 0 8px 18px rgba(224, 58, 120, .13); min-width: 0; }
.rank .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 22px; line-height: 1; background: var(--pink-soft); color: var(--pink-text); }
.rank .nm { overflow-wrap: anywhere; font-weight: 900; min-width: 0; }
.rank .nm .tag { margin-left: 8px; }
.rank .sc { font-variant-numeric: tabular-nums; font-weight: 900; white-space: nowrap; }
.rank .sc small { font-weight: 500; color: var(--muted); }
.rank.r1 { background: linear-gradient(100deg, #ffd3e1, #fff0c6 35%, #ffe6b8 55%, #ffd3e1); border: 2px solid var(--gold); padding-block: 18px; box-shadow: 0 0 34px rgba(246, 217, 138, .75), 0 10px 20px rgba(224, 58, 120, .2); }
.rank.r1 .n { background: var(--pink-grad); color: #ffffff; width: 52px; height: 52px; font-size: 28px; }
.rank.r1 .nm { font-size: 21px; }
.rank.r1 .nm::before { content: "♛"; margin-right: 6px; color: var(--gold-lo); }
.rank.r2 .n { background: var(--silver); color: #ffffff; }
.rank.r3 .n { background: var(--rosegold); color: #ffffff; }
.thanks { text-align: center; font-weight: 900; letter-spacing: .1em; color: var(--pink-text); }

/* ---- 音の切り替え(端末ごと) ---- */
.dock { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 18; display: flex; align-items: center; gap: 10px; }
#pick { height: 44px; padding: 0 16px; border-radius: 99px; border: 2px solid var(--pink); background: var(--paper); color: var(--pink-text); font-weight: 900; font-size: 13px; letter-spacing: .04em; box-shadow: 0 6px 16px rgba(224, 58, 120, .25); white-space: nowrap; }
#snd { position: relative; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--pink); background: var(--paper); color: var(--pink-text); font-size: 24px; line-height: 1;
  display: grid; place-items: center; box-shadow: 0 6px 16px rgba(224, 58, 120, .3); padding: 0; }
#snd[aria-pressed="true"] { background: var(--pink-grad); color: #ffffff; border-color: #ffffff; }
#snd:not([aria-pressed="true"])::after { content: ""; position: absolute; width: 34px; height: 2.5px; background: var(--pink-text); border-radius: 2px; transform: rotate(-45deg); }
#snd small { position: absolute; bottom: -2px; font-size: 10px; font-weight: 900; letter-spacing: .04em; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #ffffff; font-weight: 700; padding: 10px 18px; border-radius: 18px; font-size: 14px; max-width: 90vw; z-index: 20; text-align: center; }
.foot { text-align: center; }
#replay { background: transparent; border: 0; color: var(--muted); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 12px; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
#app { display: flex; flex-direction: column; gap: 20px; }

/* ---- オープニング(作戦室の画面。回線 → レーダー → 接触 → ハート → 画面が割れる → タイトル) ---- */
#open { position: fixed; inset: 0; z-index: 50; background: #04070d; color: #ffd9a0; overflow: hidden; font-family: var(--font-body); }
#open.out { opacity: 0; transition: opacity .9s ease; pointer-events: none; }
#ofx { position: absolute; inset: 0; width: 100%; height: 100%; }
.o-vig { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0, 0, 0, .65) 100%); }
.o-text { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 0 24px; text-align: center; pointer-events: none; }
.o-title { opacity: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.o-eye { font-weight: 900; font-size: 13px; letter-spacing: .6em; text-indent: .6em; color: #f6d98a; }
.o-names { font-family: var(--font-script); font-size: clamp(64px, 20vw, 132px); line-height: 1.02; display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 4px 18px rgba(0, 0, 0, .8)); }
.o-names span { padding: 0 .1em .08em; background: linear-gradient(100deg, #b8842a 0%, #f6d98a 30%, #fff3c9 48%, #f6d98a 66%, #b8842a 100%); background-size: 260% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.o-names span:first-child { transform: translateX(-.4em); } .o-names span:last-child { transform: translateX(.35em); }
@media (min-width: 640px) { .o-names { flex-direction: row; column-gap: .25em; align-items: baseline; font-size: 112px; } .o-names span:first-child, .o-names span:last-child { transform: none; } }
.o-rule { width: 0; height: 1.5px; background: linear-gradient(90deg, transparent, #f6d98a, transparent); }
.o-tag { opacity: 0; font-weight: 900; font-size: clamp(15px, 4vw, 20px); letter-spacing: .5em; text-indent: .5em; }
.o-credit { margin-top: 10px; opacity: 0; font-size: 13px; font-weight: 700; letter-spacing: .3em; text-indent: .3em; color: rgba(243, 230, 207, .8); }
.o-flash { position: absolute; inset: 0; background: #fff6dc; opacity: 0; z-index: 4; pointer-events: none; }
.o-gate { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 24px; background: #04070d; transition: opacity .5s ease; }
.o-gate.go { opacity: 0; pointer-events: none; }
.o-gate .o-eye { margin-bottom: 8px; }
#open button:focus-visible { outline: 3px solid #f6d98a; outline-offset: 3px; }
.o-gate .btn { width: min(320px, 100%); }
.o-gate .btn.ghost { background: transparent; border-color: rgba(246, 217, 138, .6); color: #f6d98a; box-shadow: none; }
.o-gate .btn.gold { background: linear-gradient(135deg, #f6d98a, #d9a441); color: #3a2606; border-color: transparent; box-shadow: 0 5px 0 #8a5f12, 0 12px 24px rgba(0, 0, 0, .5); }
.o-note { font-size: 12px; color: rgba(243, 230, 207, .6); text-align: center; }
#oskip { position: absolute; z-index: 7; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); height: 40px; padding: 0 16px; border-radius: 99px;
  border: 1px solid rgba(243, 230, 207, .5); background: rgba(0, 0, 0, .35); color: #f3e6cf; font-weight: 900; font-size: 13px; letter-spacing: .14em; opacity: 0; pointer-events: none; }
#open.run #oskip { opacity: 1; pointer-events: auto; transition: opacity .6s .8s; }
#open.run .o-title { animation: otitle 2.2s 26.8s cubic-bezier(.1, .8, .2, 1) forwards, oglitch .5s 26.8s steps(1); }
#open.run .o-names span { animation: osheen 4s 27.0s ease-out forwards; }
#open.run .o-rule { animation: orule 1.6s 28.4s ease-out forwards; }
#open.run .o-tag { animation: ofade 1.4s 29.4s ease-out forwards; }
#open.run .o-credit { animation: ofade 1.4s 30.6s ease-out forwards; }
#open.run .o-flash { animation: oflash .9s 26.8s ease-out; }
@keyframes ofade { to { opacity: 1; } }
@keyframes otitle { from { opacity: 0; transform: scale(1.18); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }

<script>
(function () {
  "use strict";
  var LETTERS = ["A", "B", "C", "D"];
  var DEFAULT_STATE = { phase: "collect", order: [], idx: 0 };
  var S = { state: DEFAULT_STATE, questions: [], players: [], answers: [] };
  var db = null, isHost = false, canWrite = true, mounted = "";
  var $ = function (s) { return document.querySelector(s); };
  var reduced = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  // 端末に保存できないとき(プライベートモード等)でも動くようにする
  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var pid = LS.get("quiz.pid");
  if (!pid) { pid = "p" + Math.random().toString(36).slice(2, 12); LS.set("quiz.pid", pid); }
  var myName = LS.get("quiz.name") || "";

  // 外から来た文字列は textContent だけで入れる
  function h(tag, props) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null) e.append(x); });
      else e.append(c);
    }
    return e;
  }
  var toastTimer;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3600);
  }
  function guard(p) {
    return Promise.resolve(p).catch(function (e) {
      toast((e && e.code === "invalid_argument") ? "書き込みの権限がありません。主催者に共有設定を確認してもらってください。" : "うまく送れませんでした。もう一度お試しください。");
      throw e;
    });
  }
  function stateDoc() { return db.doc("state/main"); }
  function setState(patch) { return guard(stateDoc().set(Object.assign({}, S.state, patch))); }

  // ---------- 音(BGMと効果音) ----------
  // 標準のBGMは音源ファイルを使わず、その場でオルゴール風の音を合成する
  // (カノン進行 C-G-Am-Em-F-C-F-G のやさしいアルペジオ)。
  // 「曲を選ぶ」で、その端末に入っている自分の音楽ファイルを流すこともできる。
  // ファイルは端末の中で読み込むだけで、アップロードも他の人への配信もしない。
  // どちらも「オン」にした端末だけで鳴る。
  // オープニングの時刻表(秒)。画面と音の両方がこれに合わせる
  var OPEN_TL = { radar: 3.4, pinA: 5.2, pinB: 6.6, link: 7.4, move: 11, contact: 16.2, heart: 17, grant: 19.4, words: [21, 21.8, 22.6, 23.4], ask: 24.6, title: 26.8 };
  var Snd = (function () {
    var ctx = null, out = null, conv = null, bus = null, on = false, timer = null, nextT = 0, bar = 0;
    var fileBuf = null, fileSrc = null;
    var BEAT = 60 / 66;
    var CH = [
      { n: [36, 43, 60, 64, 67, 72], mel: [76, 74] }, { n: [31, 38, 59, 62, 67, 71], mel: [72, 71] },
      { n: [33, 40, 60, 64, 69, 72], mel: [69, 67] }, { n: [28, 35, 59, 64, 67, 71], mel: [69, 71] },
      { n: [29, 36, 60, 65, 69, 72], mel: [72, 69] }, { n: [36, 43, 60, 64, 67, 72], mel: [67, 76] },
      { n: [29, 36, 60, 65, 69, 72], mel: [77, 76] }, { n: [31, 38, 59, 62, 67, 71], mel: [74, 71] }
    ];
    var ARP = [1, 3, 4, 5, 4, 3, 4, 2];
    function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function init() {
      if (ctx) return true;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      out = ctx.createGain(); out.gain.value = 0;
      var comp = ctx.createDynamicsCompressor(); out.connect(comp); comp.connect(ctx.destination);
      // 残響: 減衰するノイズを畳み込む
      var len = Math.floor(ctx.sampleRate * 2.6), buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var c = 0; c < 2; c++) { var d = buf.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4); }
      conv = ctx.createConvolver(); conv.buffer = buf;
      var wet = ctx.createGain(); wet.gain.value = .42; conv.connect(wet); wet.connect(comp);
      return true;
    }
    function bell(t, m, v, d) {
      var f = hz(m), g = ctx.createGain();
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      g.connect(bus);
      [[1, 1], [2.01, .28], [3.02, .08]].forEach(function (p) {
        var o = ctx.createOscillator(), pg = ctx.createGain();
        o.type = "sine"; o.frequency.value = f * p[0]; pg.gain.value = p[1];
        o.connect(pg); pg.connect(g); o.start(t); o.stop(t + d + .05);
      });
    }
    function pad(t, notes, d) {
      var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1100;
      var g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.05, t + .9); g.gain.linearRampToValueAtTime(.0001, t + d);
      lp.connect(g); g.connect(bus);
      notes.forEach(function (m) {
        [-4, 4].forEach(function (cents) {
          var o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = hz(m); o.detune.value = cents;
          o.connect(lp); o.start(t); o.stop(t + d + .05);
        });
      });
    }
    function playBar(i, t) {
      var ch = CH[i % CH.length], n = ch.n;
      pad(t, [n[1], n[2], n[3], n[4]], 4 * BEAT + .8);
      bell(t, n[0] + 12, .14, 3.2); bell(t + 2 * BEAT, n[0] + 12, .1, 2.4);
      ARP.forEach(function (k, j) { bell(t + j * BEAT / 2, n[k], .1, 1.6); });
      bell(t, ch.mel[0], .17, 2.4); bell(t + 2 * BEAT, ch.mel[1], .17, 2.4);
    }
    function tick() { while (nextT < ctx.currentTime + .7) { playBar(bar++, nextT); nextT += 4 * BEAT; } }
    function stopFile() { if (fileSrc) { try { fileSrc.stop(); } catch (e) {} fileSrc = null; } }
    function startPlayback() {
      bus = ctx.createGain(); bus.connect(out); bus.connect(conv);
      stopFile();
      if (fileBuf) {
        fileSrc = ctx.createBufferSource(); fileSrc.buffer = fileBuf; fileSrc.loop = true;
        fileSrc.connect(out); fileSrc.start();
      } else { nextT = ctx.currentTime + .15; bar = 0; tick(); clearInterval(timer); timer = setInterval(tick, 200); }
    }
    function set(v) {
      if (v) {
        if (!init()) return false;
        ctx.resume();
        on = true; out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setTargetAtTime(fileBuf ? .9 : .6, ctx.currentTime, .3);
        startPlayback();
      } else if (ctx) {
        on = false; clearInterval(timer); stopFile();
        out.gain.setTargetAtTime(0, ctx.currentTime, .12);
        var old = bus; setTimeout(function () { try { old.disconnect(); } catch (e) {} }, 700); // 先に予約した音も切る
      }
      return true;
    }
    // 自分の音楽ファイルを読み込む(端末の中だけ)。流れている間に選んだら、すぐ切り替える
    function loadFile(file) {
      if (!init()) return Promise.reject(new Error("no audio"));
      return file.arrayBuffer().then(function (ab) {
        return new Promise(function (res, rej) { ctx.decodeAudioData(ab, res, rej); });
      }).then(function (buf) {
        fileBuf = buf;
        if (on) { clearInterval(timer); out.gain.setTargetAtTime(.9, ctx.currentTime, .1); try { bus.disconnect(); } catch (e) {} startPlayback(); }
      });
    }

    // オープニング用の演出音(画面の進行 OPEN_TL と同じ時刻で鳴らす)。
    // 回線の電子音 → レーダーの探知音 → カウントダウン → 接触の衝撃 → ハートが灯る音 → 言葉ごとの衝撃 → タイトル。すべてその場で合成。
    var cineBus = null;
    function cine() {
      if (!init()) return false;
      ctx.resume();
      var L = OPEN_TL, t0 = ctx.currentTime + .12, T = L.title, old = bus, i, k;
      cineBus = ctx.createGain(); cineBus.connect(out); cineBus.connect(conv); bus = cineBus;
      out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setTargetAtTime(.9, ctx.currentTime, .1);
      var nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), nd = nb.getChannelData(0);
      for (i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      function tone(dt, f, v, d, type) {
        var o = ctx.createOscillator(), g = ctx.createGain(); o.type = type || "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(v, t0 + dt + .006); g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + d);
        o.connect(g); g.connect(bus); o.start(t0 + dt); o.stop(t0 + dt + d + .02);
      }
      function hit(dt, v) {
        var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine";
        o.frequency.setValueAtTime(110, t0 + dt); o.frequency.exponentialRampToValueAtTime(35, t0 + dt + .35);
        g.gain.setValueAtTime(v, t0 + dt); g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .7);
        o.connect(g); g.connect(bus); o.start(t0 + dt); o.stop(t0 + dt + .75);
        var n = ctx.createBufferSource(); n.buffer = nb; var f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1800;
        var ng = ctx.createGain(); ng.gain.setValueAtTime(.35, t0 + dt); ng.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .25);
        n.connect(f); f.connect(ng); ng.connect(bus); n.start(t0 + dt); n.stop(t0 + dt + .3);
      }
      // 低いうなり(ずっと鳴り続け、タイトルへ向けて膨らむ)
      var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(110, t0); lp.frequency.exponentialRampToValueAtTime(800, t0 + T);
      var dg = ctx.createGain(); dg.gain.setValueAtTime(.0001, t0); dg.gain.exponentialRampToValueAtTime(.14, t0 + T); dg.gain.exponentialRampToValueAtTime(.0001, t0 + T + 4.5);
      lp.connect(dg); dg.connect(bus);
      [55, 55.4, 82.4].forEach(function (f) { var o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(lp); o.start(t0); o.stop(t0 + T + 4.6); });
      // タイトルへ向かうせり上がる風
      var ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
      var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2; bp.frequency.setValueAtTime(300, t0 + T - 6); bp.frequency.exponentialRampToValueAtTime(5000, t0 + T);
      var rg = ctx.createGain(); rg.gain.setValueAtTime(.0001, t0 + T - 6); rg.gain.exponentialRampToValueAtTime(.3, t0 + T - .05); rg.gain.setValueAtTime(.0001, t0 + T);
      ns.connect(bp); bp.connect(rg); rg.connect(bus); ns.start(t0 + T - 6); ns.stop(t0 + T + .1);
      // 回線がつながる電子音
      [.3, 1, 1.7, 2.4].forEach(function (dt) { tone(dt, 1400, .07, .08, "square"); });
      tone(3.0, 700, .09, .5); tone(3.2, 1050, .09, .5);
      // レーダー: 探知音(2人が見つかるたびに高くなる)
      [[L.radar, 660], [L.pinA, 880], [L.pinB, 1175]].forEach(function (p) { tone(p[0], p[1], .22, 1.8); });
      for (k = 0; k < 8; k++) tone(L.link + k * .2, 1800, .04, .05, "square");
      // カウントダウン(1秒ごとに音程が上がる)
      for (k = 0; k < 5; k++) tone(L.move + k, 660 * Math.pow(2, k / 6), .18, .18, "square");
      hit(L.contact, 1);
      // 点がハートになる間の、上がっていく鈴の音
      [72, 76, 79, 84, 88, 91, 96, 91, 88, 84].forEach(function (m, j) { bell(t0 + L.heart + j * .22, m, .1, 1.8); });
      bell(t0 + L.grant, 84, .14, 2.5); bell(t0 + L.grant + .2, 91, .14, 2.5);
      // 言葉が切り替わるたびの衝撃
      hit(L.words[0], .8); hit(L.words[1], .8); hit(L.words[2], .9); hit(L.words[3], 1);
      [24.6, 25.4, 25.9, 26.3, 26.6].forEach(function (dt) {
        var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine";
        o.frequency.setValueAtTime(70, t0 + dt); o.frequency.exponentialRampToValueAtTime(40, t0 + dt + .3);
        g.gain.setValueAtTime(.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(.5, t0 + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .45);
        o.connect(g); g.connect(bus); o.start(t0 + dt); o.stop(t0 + dt + .5);
      });
      // タイトル: 衝撃音と金色の和音
      var bo = ctx.createOscillator(), bg = ctx.createGain(); bo.type = "sine";
      bo.frequency.setValueAtTime(90, t0 + T); bo.frequency.exponentialRampToValueAtTime(30, t0 + T + 1);
      bg.gain.setValueAtTime(.9, t0 + T); bg.gain.exponentialRampToValueAtTime(.0001, t0 + T + 2.6);
      bo.connect(bg); bg.connect(bus); bo.start(t0 + T); bo.stop(t0 + T + 2.7);
      var n2 = ctx.createBufferSource(); n2.buffer = nb;
      var lp2 = ctx.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.setValueAtTime(2200, t0 + T); lp2.frequency.exponentialRampToValueAtTime(200, t0 + T + 1.4);
      var g2 = ctx.createGain(); g2.gain.setValueAtTime(.6, t0 + T); g2.gain.exponentialRampToValueAtTime(.0001, t0 + T + 1.6);
      n2.connect(lp2); lp2.connect(g2); g2.connect(bus); n2.start(t0 + T); n2.stop(t0 + T + 1.7);
      [60, 67, 72, 76, 79].forEach(function (m) { bell(t0 + T + .02, m, .16, 5); });
      [84, 88, 91, 96].forEach(function (m, j) { bell(t0 + T + .5 + j * .28, m, .13, 3.2); });
      bus = old;
      return true;
    }
    function cineStop() {
      if (!cineBus || !ctx) return;
      var b = cineBus; cineBus = null;
      out.gain.setTargetAtTime(0, ctx.currentTime, .15);
      setTimeout(function () { try { b.disconnect(); } catch (e) {} }, 900);
    }
    function fx(notes, step, v, d) { if (!on || fileBuf) return; var t = ctx.currentTime + .03; notes.forEach(function (m, i) { bell(t + i * step, m, v, d); }); }
    document.addEventListener("visibilitychange", function () { if (!ctx || !on) return; if (document.hidden) ctx.suspend(); else ctx.resume(); });
    return {
      isOn: function () { return on; }, set: set, loadFile: loadFile, cine: cine, cineStop: cineStop,
      pon: function () { fx([91], 0, .08, .9); },
      correct: function () { fx([84, 88, 91, 96], .09, .2, 1.8); },
      fanfare: function () { fx([72, 76, 79, 84, 88, 91, 96, 100], .12, .2, 2.6); }
    };
  })();

  // ---------- 集計 ----------
  function qById(id) { return S.questions.filter(function (q) { return q.id === id; })[0]; }
  function answersOf(qid) { return S.answers.filter(function (a) { return a.qid === qid; }); }
  function myAnswer(qid) { return S.answers.filter(function (a) { return a.id === qid + "_" + pid; })[0]; }
  function eligibleCount(q) { return S.players.filter(function (p) { return p.id !== q.by; }).length; }
  function ranking() {
    var rows = {};
    S.players.forEach(function (p) { rows[p.id] = { id: p.id, name: p.name, score: 0, total: 0 }; });
    S.state.order.forEach(function (qid) {
      var q = qById(qid); if (!q) return;

      }, onErr);
    }
    stateDoc().onSnapshot(function (snap) {
      mark();
      var d = snap.exists ? snap.data() : null;
      S.state = d ? { phase: d.phase || "collect", order: d.order || [], idx: d.idx || 0 } : DEFAULT_STATE;
      render();
    }, onErr);
    coll("questions"); coll("players"); coll("answers");
  }


  // ---------- オープニング ----------
  // 開いた直後に流す。公開の更新などで読み込み直されたとき、クイズの途中で流れないように、
  // 見てから20分以内は省く。動きを減らす設定の端末では出さない。
  // 司会は、ページ下の「オープニングをもう一度見る」で、いつでも見直せる。
  var OPEN_WINDOW = 20 * 60 * 1000, openRaf = 0, openKeyBound = false;
  function opening(force) {
    var ov = $("#open"), last = 0;
    try { last = parseInt(sessionStorage.getItem("quiz.opened") || "0", 10) || 0; } catch (e) {}
    if (reduced || (!force && Date.now() - last < OPEN_WINDOW)) { ov.hidden = true; return; }
    cancelAnimationFrame(openRaf);
    ov.classList.remove("run", "out"); $("#ogate").classList.remove("go"); ov.hidden = false; void ov.offsetWidth;
    var main = $("main"), gate = $("#ogate"), withSound = false, ended = false, endTimer, startAt = 0;
    main.inert = true;
    $("#oSound").focus();

    // ---- 作戦室の画面を、時刻 t(秒)から描く ----
    var L = OPEN_TL, AMB = "255,179,71", HEART = "255,143,177";
    var cv = $("#ofx"), ctx = cv.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, land = [];
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var gx = 0; gx < W / 13; gx++) for (var gy = 0; gy < H / 13; gy++) {
      var nv = Math.sin(gx * .33) + Math.sin(gy * .29 + gx * .11) + Math.sin((gx + gy) * .17);
      if (nv > .95) land.push([gx * 13 + 6, gy * 13 + 6]);
    }
    function clamp(x) { return Math.max(0, Math.min(1, x)); }
    function ease(x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
    function txt(str, x, y, size, color, align, weight) {
      ctx.font = (weight || 700) + " " + size + "px 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif";
      ctx.fillStyle = color; ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(str, x, y);
    }
    function glitch(strength) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      for (var n = 0; n < 6; n++) {
        var y = Math.floor(Math.random() * cv.height), hh = 6 + Math.floor(Math.random() * 40 * dpr), dx = Math.floor((Math.random() - .5) * strength * dpr);
        ctx.drawImage(cv, 0, y, cv.width, hh, dx, y, cv.width, hh);
      }
      ctx.restore();
    }
    function hud(t) {
      var R = Math.min(W, H) * .4, cx = W / 2, cy = H * .47, x, y, k;
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.fillStyle = "#04070d"; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(" + AMB + ",.05)"; ctx.lineWidth = 1; ctx.beginPath();
      for (x = 0; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();

      // 1) 回線がつながる
      if (t < L.radar) {
        var lines = ["CONNECTING ...", "SERVER : WEDDING-QUIZ", "USER   : GUEST", "認証 ― OK"], at = [.3, 1, 1.7, 2.4];
        lines.forEach(function (ln, i) {
          var n = Math.floor((t - at[i]) * 26); if (n <= 0) return;
          txt(ln.slice(0, n) + (n < ln.length && Math.floor(t * 8) % 2 ? "▌" : ""), W * .12, H * .34 + i * 30, 16, "rgb(" + AMB + ")");
        });
        var pg = clamp((t - .3) / 2.9);
        ctx.strokeStyle = "rgba(" + AMB + ",.7)"; ctx.strokeRect(W * .12, H * .6, W * .76, 10);
        ctx.fillStyle = "rgba(" + AMB + ",.9)"; ctx.fillRect(W * .12 + 2, H * .6 + 2, (W * .76 - 4) * pg, 6);
        txt(Math.floor(pg * 100) + " %", W * .88, H * .6 + 28, 13, "rgba(" + AMB + ",.8)", "right");
      }

      // 2) レーダーと地図
      if (t >= L.radar) {
        var fa = clamp((t - L.radar) / 1.2);
        ctx.fillStyle = "rgba(" + AMB + "," + (.28 * fa) + ")";
        land.forEach(function (d) { ctx.fillRect(d[0], d[1], 2, 2); });
        ctx.strokeStyle = "rgba(" + AMB + "," + (.3 * fa) + ")";
        for (k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(cx, cy, R * k / 3, 0, 6.2832); ctx.stroke(); }
        ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
        if (t < L.title) {
          var ang = (t - L.radar) * 1.7;
          for (k = 0; k < 26; k++) {
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, ang - (k + 1) * .045, ang - k * .045); ctx.closePath();
            ctx.fillStyle = "rgba(" + AMB + "," + (.2 * (1 - k / 26) * fa) + ")"; ctx.fill();
          }
        }
      }

      // 3) 2人の位置、結ぶ線、距離、カウントダウン
      if (t >= L.pinA && t < L.words[0] - .05) {
        var pm = ease(clamp((t - L.move) / (L.contact - L.move)));
        var ax = (cx - R * .78) + (R * .78 - 9) * pm, ay = (cy - R * .3) + (R * .3 - 4) * pm;
        var bx = (cx + R * .78) - (R * .78 - 9) * pm, by = (cy + R * .34) - (R * .34 - 4) * pm;
        function pin(px, py, born, label, below) {
          var a = t - born; if (a < 0) return;
          var box = 14 + 34 * (1 - ease(clamp(a / .5)));
          ctx.strokeStyle = "rgba(" + AMB + ",1)"; ctx.lineWidth = 1.5;
          ctx.strokeRect(px - box, py - box, box * 2, box * 2);
          ctx.beginPath(); ctx.arc(px, py, 4, 0, 6.2832); ctx.fillStyle = "rgb(" + AMB + ")"; ctx.fill();
          ctx.beginPath(); ctx.arc(px, py, 6 + (a % 1.6) * 40, 0, 6.2832); ctx.strokeStyle = "rgba(" + AMB + "," + (.6 * (1 - (a % 1.6) / 1.6)) + ")"; ctx.stroke();
          txt(label, px, py + (below ? box + 14 : -box - 14), 13, "rgb(" + AMB + ")", "center", 900);
        }
        if (t < L.contact + .3) {
          if (t >= L.link) {
            var lk = ease(clamp((t - L.link) / 1.6));
            ctx.setLineDash([6, 6]); ctx.strokeStyle = "rgba(" + AMB + ",.7)"; ctx.lineWidth = 1.5; ctx.beginPath();
            ctx.moveTo(ax, ay); ctx.lineTo(ax + (bx - ax) * lk, ay + (by - ay) * lk); ctx.stroke(); ctx.setLineDash([]);
          }
          pin(ax, ay, L.pinA, "TARGET-A  MISATO", false);
          pin(bx, by, L.pinB, "TARGET-B  TAIGA", true);
          if (t >= L.link) {
            var dist = Math.round(8412 * (1 - pm));
            txt("DISTANCE  " + (t < L.link + 1.6 ? "- - - -" : String(dist).replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + " km", cx, H * .13, 15, "rgb(" + AMB + ")", "center", 900);
          }
          if (t >= L.move && t < L.contact) {
            var sec = Math.ceil(L.contact - t);
            txt(String(sec), cx, cy, R * 1.1, "rgba(" + AMB + "," + (.1 + .12 * (1 - ((L.contact - t) % 1))) + ")", "center", 900);
            txt("CONTACT IN  00:0" + sec, cx, H * .87, 15, "rgb(" + AMB + ")", "center", 900);
          }
        }
        // 接触: 輪が広がり、点がハートになっていく
        if (t >= L.contact && t < L.contact + 1.4) {
          var cr = (t - L.contact) * R * 1.8;
          ctx.strokeStyle = "rgba(" + AMB + "," + (1 - (t - L.contact) / 1.4) + ")"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, cr, 0, 6.2832); ctx.stroke();
          ctx.fillStyle = "rgba(255,246,220," + Math.max(0, .5 - (t - L.contact) * 1.6) + ")"; ctx.fillRect(0, 0, W, H);
          txt("CONTACT", cx, H * .13, 26, "rgb(" + AMB + ")", "center", 900);
        }
        if (t >= L.heart) {
          var N = 130, sh = Math.min(W, H) * .0125, shown = Math.floor(clamp((t - L.heart) / 2.2) * N), pulse = 1 + .05 * Math.sin(t * 7) * clamp((t - L.heart - 2.2) * 2);
          for (k = 0; k < shown; k++) {
            var th = k / N * 6.2832, hx = 16 * Math.pow(Math.sin(th), 3), hy = -(13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th));
            ctx.beginPath(); ctx.arc(cx + hx * sh * pulse, cy + hy * sh * pulse - sh * 2, 3.2, 0, 6.2832);
            ctx.fillStyle = "rgba(" + HEART + ",.95)"; ctx.shadowColor = "rgb(" + HEART + ")"; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
          }
          if (t >= L.heart + 2.2) txt("TARGET  MATCHED", cx, cy + sh * 19, 15, "rgb(" + HEART + ")", "center", 900);
          if (t >= L.grant && t < L.words[0] - .1) {
            var gw = Math.min(W * .8, 340);
            ctx.strokeStyle = "rgb(" + AMB + ")"; ctx.lineWidth = 2; ctx.strokeRect(cx - gw / 2, H * .13 - 22, gw, 44);
            txt("ACCESS GRANTED ― 判定 : 結婚", cx, H * .13, 16, "rgb(" + AMB + ")", "center", 900);
          }
        }
      }

      // 4) 画面が割れて、言葉が叩きつけられる
      for (k = 0; k < 4; k++) {
        var wt = t - L.words[k], dur = k < 3 ? .8 : 1.8;
        if (wt < 0 || wt > dur) continue;
        var word = ["愛", "絆", "秘密", "全員、主役。"][k], fs = k < 3 ? Math.min(W * .5, 240) : Math.min(W * .17, 100);
        ctx.fillStyle = "#04070d"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "rgba(" + AMB + "," + Math.max(0, .85 - wt * 4) + ")"; ctx.fillRect(0, 0, W, H);
        var off = Math.max(0, 10 - wt * 40);
        ctx.globalCompositeOperation = "lighter";
        txt(word, cx - off, cy, fs, "rgba(255,45,85,.9)", "center", 900);
        txt(word, cx + off, cy, fs, "rgba(0,229,255,.9)", "center", 900);
        txt(word, cx, cy, fs, "rgba(255,217,160,.95)", "center", 900);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0,0,0,.5)"; var by2 = (wt * 900) % H; ctx.fillRect(0, by2, W, 3);
      }
      if (t >= L.ask && t < L.title) {
        var q = "ご列席のみなさまに、問う。", qn = Math.floor((t - L.ask) * 14);
        ctx.fillStyle = "rgba(4,7,13,.85)"; ctx.fillRect(0, cy - 40, W, 80);
        txt(q.slice(0, qn), cx, cy, Math.min(26, W * .06), "rgb(255,217,160)", "center", 900);
      }
      // タイトルのあいだも、背景で輪が静かに広がる
      if (t >= L.title) {
        for (k = 0; k < 3; k++) {
          var rp = ((t - L.title) * .5 + k / 3) % 1;
          ctx.strokeStyle = "rgba(" + AMB + "," + (.25 * (1 - rp)) + ")"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, rp * R * 1.4, 0, 6.2832); ctx.stroke();
        }
      }

      // 5) 画面の四隅(録画中の表示、時刻、座標)
      var m = 14, bl = 22;
      ctx.strokeStyle = "rgba(" + AMB + ",.8)"; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(m, m + bl); ctx.lineTo(m, m); ctx.lineTo(m + bl, m);
      ctx.moveTo(W - m - bl, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - bl);
      ctx.moveTo(m, H - m - bl); ctx.lineTo(m, H - m); ctx.lineTo(m + bl, H - m);
      ctx.moveTo(W - m, m + bl + 50); ctx.lineTo(W - m, m + 50);
      ctx.stroke();
      var ss = Math.floor(t), ff = Math.floor((t % 1) * 30), pad = function (v) { return (v < 10 ? "0" : "") + v; };
      if (Math.floor(t * 2) % 2 === 0) { ctx.beginPath(); ctx.arc(m + 8, m + 30, 5, 0, 6.2832); ctx.fillStyle = "#ff3b3b"; ctx.fill(); }
      txt("REC  00:00:" + pad(ss) + ":" + pad(ff), m + 20, m + 30, 12, "rgba(" + AMB + ",.9)", "left", 900);
      txt("N 35." + (6812 + Math.floor(t * 37) % 900) + "   E 139." + (7671 + Math.floor(t * 53) % 900), m + 8, H - m - 34, 11, "rgba(" + AMB + ",.8)", "left", 700);

      // 6) 切り替わりの乱れ
      var gl = [L.radar, L.move, L.contact, L.words[0] - .05, L.title].some(function (g) { return t >= g && t < g + .25; });
      if (gl) glitch(60); else if (Math.random() < .015) glitch(24);
    }
    (function frame() {
      openRaf = requestAnimationFrame(frame);
      if (!startAt) { ctx.fillStyle = "#04070d"; ctx.fillRect(0, 0, W, H); return; }
      hud((performance.now() - startAt) / 1000);
    })();
    function finish() {
      if (ended) return; ended = true;
      clearTimeout(endTimer);
      try { sessionStorage.setItem("quiz.opened", String(Date.now())); } catch (e) {}
      Snd.cineStop();
      if (withSound) { if (Snd.isOn()) Snd.set(false); if (Snd.set(true)) $("#snd").setAttribute("aria-pressed", "true"); }
      ov.classList.add("out"); main.inert = false;
      setTimeout(function () { if (!ended) return; cancelAnimationFrame(openRaf); ov.hidden = true; ov.classList.remove("run", "out"); gate.classList.remove("go"); }, 1000);
    }
    function go(sound) {
      withSound = sound;
      if (sound && !Snd.cine()) withSound = false;
      gate.classList.add("go"); ov.classList.add("run"); startAt = performance.now();
      $("#oskip").focus();
      endTimer = setTimeout(finish, 33800);
    }
    $("#oSound").onclick = function () { go(true); };
    $("#oQuiet").onclick = function () { go(false); };
    $("#oskip").onclick = finish;
    if (!openKeyBound) {
      openKeyBound = true;
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ov.classList.contains("run") && !ov.classList.contains("out")) $("#oskip").click(); });
    }
  }

  // 音の切り替え(端末ごと。押した人の端末だけ鳴る)
  var snd = $("#snd");
  snd.addEventListener("click", function () {
    var want = !Snd.isOn();
    if (!Snd.set(want)) { toast("この端末では音を出せません"); return; }
    snd.setAttribute("aria-pressed", String(want));
    toast(want ? "BGMをオンにしました。音が出ない時は、マナーモードを確認してください" : "BGMをオフにしました");
  });
  // 自分の音楽ファイルを選ぶ(この端末の中だけで再生する)
  var fileIn = $("#file");
  $("#pick").addEventListener("click", function () { fileIn.click(); });
  fileIn.addEventListener("change", function () {
    var f = fileIn.files && fileIn.files[0];
    if (!f) return;
    toast("読み込み中です…");
    Snd.loadFile(f).then(function () {
      toast("「" + f.name + "」をBGMに設定しました。右下の♪を押すと流れます(この端末だけ)");
    }).catch(function () { toast("この曲は読み込めませんでした。mp3 や m4a のファイルを選んでください"); });
    fileIn.value = "";
  });

  $("#replay").addEventListener("click", function () { window.scrollTo(0, 0); opening(true); });
  petals();
  opening(false);
  var c = window.claude;
  if (!c || !c.use) { fail("このページはClaudeの画面で開いてください。"); return; }
  Promise.all([c.use("db"), c.use("user")]).then(function (r) {
    db = r[0];
    if (!db) { fail("サインインしてから開き直してください。"); return; }
    var user = r[1];
    return Promise.all([user ? user.canEdit() : false, user ? user.can("data.write") : null]).then(function (v) {
      isHost = !!v[0]; canWrite = v[1] !== false;
      $("#foot").hidden = !isHost;
      start();
    });
  });
})();
</script>
