<title>みんなのクイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 全員のスマホで1画面ずつ進む縦長のクイズ。上に今の段階、中央に問題、下に司会の操作。 */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --ink: #16233b;
  --muted: #5b6b86;
  --line: #d5deec;
  --accent: #2748d8;
  --on-accent: #ffffff;
  --accent-soft: #e4eaff;
  --ok: #0c7a4d;
  --ok-bg: #dcf5e8;
  --ng: #b3261e;
  --ng-bg: #fde4e1;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
  --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1626; --surface: #19233a; --ink: #e8eefb; --muted: #9db0d0; --line: #2c3a58;
    --accent: #8ea6ff; --on-accent: #0f1626; --accent-soft: #24315a;
    --ok: #6fdba5; --ok-bg: #12382a; --ng: #ff9a92; --ng-bg: #432120;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1626; --surface: #19233a; --ink: #e8eefb; --muted: #9db0d0; --line: #2c3a58;
  --accent: #8ea6ff; --on-accent: #0f1626; --accent-soft: #24315a;
  --ok: #6fdba5; --ok-bg: #12382a; --ng: #ff9a92; --ng-bg: #432120;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.35; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 900; }
h2 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.chip { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.who { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hint { color: var(--muted); font-size: 14px; }
.warn { background: var(--ng-bg); color: var(--ng); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.stat { display: flex; gap: 16px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-size: 18px; }
label.f { font-weight: 700; font-size: 14px; display: block; margin-bottom: 4px; }
textarea, input[type="text"] {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
textarea { resize: vertical; min-height: 84px; }
textarea:focus, input:focus, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.optrow { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; }
.optrow label.radio { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); cursor: pointer; font-weight: 700; font-size: 14px; color: var(--muted); }
.optrow input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
.optrow input[type="radio"]:checked + span { color: var(--on-accent); }
.optrow label.radio:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.optrow label.radio:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 1px; }
button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px; min-height: 48px; padding: 0 18px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); }
button.primary { background: var(--accent); color: var(--on-accent); }
button.small { min-height: 40px; padding: 0 12px; font-size: 14px; }
button.danger { border-color: var(--ng); color: var(--ng); }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; min-width: 0; }
.item span.t { min-width: 0; overflow-wrap: anywhere; }
.item small { color: var(--muted); display: block; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.qtext { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.by { color: var(--muted); font-size: 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { position: relative; display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%;
  min-height: 56px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; overflow: hidden; }
.opt .badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 900; font-family: var(--font-display); position: relative; }
.opt .label { overflow-wrap: anywhere; position: relative; }
.opt .cnt { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); position: relative; }
.opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); opacity: .8; }
.opt.chosen { border-color: var(--accent); }
.opt.chosen .badge { background: var(--accent); color: var(--on-accent); }
.opt.locked { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .badge { background: var(--ok); color: var(--surface); }
.opt.ok .bar { background: var(--ok); opacity: .18; }
.opt.ng { border-color: var(--ng); }
.opt.ng .badge { background: var(--ng); color: var(--surface); }
.verdict { font-family: var(--font-display); font-weight: 900; font-size: 20px; padding: 10px 14px; border-radius: 12px; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.ng { background: var(--ng-bg); color: var(--ng); }
.verdict.na { background: var(--accent-soft); color: var(--accent); }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.names span { background: var(--accent-soft); color: var(--ink); border-radius: 99px; padding: 2px 10px; font-size: 14px; }
.host { border: 2px dashed var(--accent); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.host .lbl { font-size: 13px; font-weight: 700; color: var(--accent); }
.host .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.host .btns button { flex: 1 1 160px; }
.rank { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.rank .n { font-family: var(--font-display); font-weight: 900; font-size: 22px; text-align: center; color: var(--muted); }
.rank .nm { overflow-wrap: anywhere; font-weight: 700; }
.rank .sc { font-variant-numeric: tabular-nums; font-weight: 700; }
.rank.top1 { border: 2px solid var(--accent); background: var(--accent-soft); }
.rank.top1 .n { color: var(--accent); font-size: 28px; }
.rank.me { outline: 2px solid var(--ok); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; max-width: 90vw; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .progress i, .opt .bar { transition: width .3s; } }
</style>

<main>
  <div class="top">
    <h1>みんなのクイズ</h1>
    <span class="chip" id="phaseChip">準備中</span>
  </div>
  <div class="who" id="who"></div>
  <div id="notice"></div>
  <div id="app"><div class="card"><p class="hint">読み込み中です…</p></div></div>
</main>
<div id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var LETTERS = ["A", "B", "C", "D"];
  var DEFAULT_STATE = { phase: "collect", order: [], idx: 0 };
  var S = { state: DEFAULT_STATE, questions: [], players: [], answers: [] };
  var db = null, isHost = false, canWrite = true, mounted = "";
  var $ = function (s) { return document.querySelector(s); };

  // 端末に保存できないとき(プライベートモード等)でも動くようにする
  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var pid = LS.get("quiz.pid");
  if (!pid) { pid = "p" + Math.random().toString(36).slice(2, 12); LS.set("quiz.pid", pid); }
  var myName = LS.get("quiz.name") || "";

  // 外から来た文字列は textContent だけで入れる
  function h(tag, props) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null) e.append(x); });
      else e.append(c);
    }
    return e;
  }
  var toastTimer;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function guard(p) {
    return Promise.resolve(p).catch(function (e) {
      toast((e && e.code === "invalid_argument") ? "書き込みの権限がありません。主催者に共有設定を確認してもらってください。" : "うまく送れませんでした。もう一度お試しください。");
      throw e;
    });
  }
  function stateDoc() { return db.doc("state/main"); }
  function setState(patch) { return guard(stateDoc().set(Object.assign({}, S.state, patch))); }

  // ---------- 集計 ----------
  function qById(id) { return S.questions.filter(function (q) { return q.id === id; })[0]; }
  function answersOf(qid) { return S.answers.filter(function (a) { return a.qid === qid; }); }
  function eligibleCount(q) { return S.players.filter(function (p) { return p.id !== q.by; }).length; }
  function ranking() {
    var rows = {};
    S.players.forEach(function (p) { rows[p.id] = { id: p.id, name: p.name, score: 0, total: 0 }; });
    S.state.order.forEach(function (qid) {
      var q = qById(qid); if (!q) return;
      Object.keys(rows).forEach(function (id) { if (id !== q.by) rows[id].total++; });
      answersOf(qid).forEach(function (a) {
        if (rows[a.pid] && a.pid !== q.by && a.choice === q.answer) rows[a.pid].score++;
      });
    });
    var list = Object.keys(rows).map(function (k) { return rows[k]; });
    list.sort(function (a, b) { return b.score - a.score || a.name.localeCompare(b.name, "ja"); });
    list.forEach(function (r) { r.rank = 1 + list.filter(function (o) { return o.score > r.score; }).length; });
    return list;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---------- 画面の部品 ----------
  function hostBox(buttons, waitText) {
    if (!isHost) return h("p", { class: "hint", text: waitText || "司会の操作を待っています。" });
    return h("div", { class: "host" }, h("div", { class: "lbl", text: "司会の操作" }), h("div", { class: "btns" }, buttons));
  }
  var formEl = null;
  function buildForm() {
    var radios = [];
    var ta = h("textarea", { id: "qText", maxlength: "120", placeholder: "例: 〇〇さんが入社して最初に配属された部署は?" });
    var err = h("p", { class: "warn", hidden: "" });
    var inputs = [];
    var rows = LETTERS.map(function (L, i) {
      var r = h("input", { type: "radio", name: "correct", id: "ok" + i, value: String(i) });
      radios.push(r);
      var inp = h("input", { type: "text", id: "opt" + i, maxlength: "40", placeholder: "選択肢" + L + (i < 2 ? "" : "(空欄でもOK)"), "aria-label": "選択肢" + L });
      inputs.push(inp);
      return h("div", { class: "optrow" }, h("label", { class: "radio", for: "ok" + i }, r, h("span", { text: "正解" })), inp);
    });
    var btn = h("button", { class: "primary", type: "button", id: "postQ", text: "この問題を出す" });
    btn.addEventListener("click", function () {
      var text = ta.value.trim();
      var opts = [], answer = -1;
      inputs.forEach(function (inp, i) {
        var v = inp.value.trim();
        if (!v) return;
        if (radios[i].checked) answer = opts.length;
        opts.push(v);
      });
      var msg = "";
      if (!text) msg = "問題文を入れてください。";
      else if (opts.length < 2) msg = "選択肢は2つ以上入れてください。";
      else if (answer < 0) msg = "正解の選択肢を「正解」の丸で選んでください。";
      err.textContent = msg; err.hidden = !msg;
      if (msg) return;
      btn.disabled = true;
      guard(db.collection("questions").add({ text: text, options: opts, answer: answer, by: pid, byName: myName, at: Date.now() }))
        .then(function () {
          ta.value = ""; inputs.forEach(function (i) { i.value = ""; }); radios.forEach(function (r) { r.checked = false; });
          toast("問題を登録しました");
        }).catch(function () {}).then(function () { btn.disabled = false; });
    });
    return h("div", { class: "list" },
      h("div", null, h("label", { class: "f", for: "qText", text: "問題文" }), ta),
      h("div", null, h("span", { class: "f", text: "選択肢(正解の丸をタップ)" }), h("div", { class: "list" }, rows)),
      err, btn);
  }

  // ---------- 各段階の画面 ----------
  function mountName() {
    var inp = h("input", { type: "text", id: "nameIn", maxlength: "12", placeholder: "例: たなか", autocomplete: "nickname" });
    var go = h("button", { class: "primary", type: "button", text: "参加する" });
    function join() {
      var n = inp.value.trim(); if (!n) { toast("名前を入れてください"); return; }
      myName = n; LS.set("quiz.name", n);
      guard(db.doc("players/" + pid).set({ name: n, at: Date.now() })).catch(function () {});
      mounted = ""; render();
    }
    go.addEventListener("click", join);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
    $("#app").replaceChildren(h("section", { class: "card" },
      h("h2", { text: "お名前を教えてください" }),
      h("p", { class: "hint", text: "順位表に出る名前です。ニックネームでも大丈夫です。" }),
      h("label", { class: "f", for: "nameIn", text: "名前" }), inp, go));
    mounted = "name";
  }

  function mountCollect() {
    if (!formEl) formEl = buildForm();
    $("#app").replaceChildren(
      h("div", { class: "stat", id: "stat" }),
      h("section", { class: "card" },
        h("h2", { text: "問題を出す" }),
        h("p", { class: "hint", text: "みんなの問題をシャッフルして出題します。自分の問題には答えられません。" }),
        formEl),
      h("section", { class: "card", id: "mine" }),
      h("div", { id: "hostSlot" }));
    mounted = "collect";
  }
  function fillCollect() {
    var n = S.questions.length;
    $("#stat").replaceChildren(h("span", null, "問題 ", h("b", { text: String(n) }), " 問"), h("span", null, "参加 ", h("b", { text: String(S.players.length) }), " 人"));
    var list = isHost ? S.questions : S.questions.filter(function (q) { return q.by === pid; });
    var items = list.map(function (q) {
      var del = h("button", { class: "small danger", type: "button", text: "削除", "aria-label": "この問題を削除" });
      del.addEventListener("click", function () { guard(db.doc("questions/" + q.id).delete()).catch(function () {}); });
      return h("div", { class: "item" },
        h("span", { class: "t" }, q.text, h("small", { text: isHost ? "出題: " + (q.byName || "不明") : q.options.length + "択" })), del);
    });
    $("#mine").replaceChildren(
      h("h2", { text: isHost ? "集まった問題(司会だけに見えます)" : "あなたの問題" }),
      items.length ? h("div", { class: "list" }, items) : h("p", { class: "hint", text: "まだありません。上のフォームから登録してください。" }));
    var start = h("button", { class: "primary", type: "button", text: "出題を始める(" + n + "問)" });
    start.disabled = n < 1;
    start.addEventListener("click", function () {
      start.disabled = true;
      setState({ phase: "question", order: shuffle(S.questions.map(function (q) { return q.id; })), idx: 0 }).catch(function () { start.disabled = false; });
    });
    $("#hostSlot").replaceChildren(hostBox([start], "出題が始まるまで、問題を登録して待ちましょう。"));
  }

  function optionsView(q, reveal, mine, isAuthor) {
    var counts = q.options.map(function () { return 0; });
    var ans = answersOf(q.id).filter(function (a) { return a.pid !== q.by; });
    ans.forEach(function (a) { if (counts[a.choice] != null) counts[a.choice]++; });
    var max = Math.max.apply(null, counts.concat([1]));
    return h("div", { class: "opts" }, q.options.map(function (text, i) {
      var cls = "opt";
      var chosen = mine && mine.choice === i;
      if (chosen) cls += " chosen";
      if (reveal) { cls += " locked"; if (i === q.answer) cls += " ok"; else if (chosen) cls += " ng"; }
      else if (mine || isAuthor) cls += " locked";
      var b = h("button", { class: cls, type: "button", "aria-pressed": chosen ? "true" : "false" },
        reveal ? h("span", { class: "bar", style: "width:" + Math.round(counts[i] / max * 100) + "%" }) : null,
        h("span", { class: "badge", text: LETTERS[i] }),
        h("span", { class: "label", text: text }),
        reveal ? h("span", { class: "cnt", text: counts[i] + "人" }) : null);
      if (!reveal && !mine && !isAuthor) {
        b.addEventListener("click", function () {
          guard(db.doc("answers/" + q.id + "_" + pid).set({ qid: q.id, pid: pid, choice: i })).catch(function () {});
        });
      }
      return b;
    }));
  }

  function viewQuestion(reveal) {
    var st = S.state, last = st.idx + 1 >= st.order.length;
    var q = qById(st.order[st.idx]);
    var head = h("div", { class: "card" },
      h("div", { class: "row" }, h("span", { class: "chip", text: "第 " + (st.idx + 1) + " 問 / 全 " + st.order.length + " 問" }),
        q ? h("span", { class: "by", text: "出題: " + (q.byName || "不明") }) : null),
      h("div", { class: "progress" }, h("i", { style: "width:" + Math.round((st.idx + (reveal ? 1 : 0)) / Math.max(1, st.order.length) * 100) + "%" })));
    var nextBtn = h("button", { class: "primary", type: "button", text: reveal ? (last ? "結果発表へ" : "次の問題へ") : "答え合わせ" });
    nextBtn.addEventListener("click", function () {
      nextBtn.disabled = true;
      var p = !reveal ? setState({ phase: "reveal" }) : (last ? setState({ phase: "final" }) : setState({ phase: "question", idx: st.idx + 1 }));
      p.catch(function () { nextBtn.disabled = false; });
    });
    if (!q) {
      $("#app").replaceChildren(head, h("div", { class: "card" }, h("p", { text: "この問題は取り下げられました。" })), hostBox([nextBtn]));
      return;
    }
    var mine = S.answers.filter(function (a) { return a.id === q.id + "_" + pid; })[0];
    var isAuthor = q.by === pid;
    var got = answersOf(q.id).filter(function (a) { return a.pid !== q.by; }).length, need = eligibleCount(q);
    var card = h("div", { class: "card" }, h("div", { class: "qtext", text: q.text }), optionsView(q, reveal, mine, isAuthor));
    var parts = [head, card];
    if (!reveal) {
      parts.push(h("div", { class: "stat" }, h("span", null, "回答 ", h("b", { text: String(got) }), " / " + need + " 人")));
      parts.push(h("p", { class: "verdict na", text: isAuthor ? "あなたが出した問題です。みんなの回答を待ちましょう。" : mine ? "回答しました。答え合わせを待っています。" : "選択肢をタップして答えてください。" }));
    } else {
      if (isAuthor) parts.push(h("p", { class: "verdict na", text: "あなたの問題でした。" }));
      else if (!mine) parts.push(h("p", { class: "verdict na", text: "今回は回答していません。" }));
      else if (mine.choice === q.answer) parts.push(h("p", { class: "verdict ok", text: "正解です!" }));
      else parts.push(h("p", { class: "verdict ng", text: "残念。正解は " + LETTERS[q.answer] + " でした。" }));
      var winners = answersOf(q.id).filter(function (a) { return a.pid !== q.by && a.choice === q.answer; })
        .map(function (a) { var p = S.players.filter(function (x) { return x.id === a.pid; })[0]; return p ? p.name : null; }).filter(Boolean);
      parts.push(h("div", { class: "card" }, h("h3", { text: "正解した人(" + winners.length + "人)" }),
        winners.length ? h("div", { class: "names" }, winners.map(function (n) { return h("span", { text: n }); })) : h("p", { class: "hint", text: "正解者はいませんでした。" })));
    }
    parts.push(hostBox([nextBtn], reveal ? "司会が次へ進めるのを待っています。" : "司会が答え合わせをするまでお待ちください。"));
    $("#app").replaceChildren.apply($("#app"), parts);
  }

  var resetArmed = false;
  function viewFinal() {
    var rows = ranking();
    var me = rows.filter(function (r) { return r.id === pid; })[0];
    var parts = [];
    parts.push(h("div", { class: "card" }, h("h2", { text: "結果発表" }),
      me ? h("p", { text: "あなたは " + me.rank + " 位(" + me.score + " / " + me.total + " 問正解)" }) : null));
    parts.push(h("div", { class: "list" }, rows.map(function (r) {
      return h("div", { class: "rank" + (r.rank === 1 ? " top1" : "") + (r.id === pid ? " me" : "") },
        h("span", { class: "n", text: String(r.rank) }), h("span", { class: "nm", text: r.name }),
        h("span", { class: "sc", text: r.score + " / " + r.total }));
    })));
    if (isHost) {
      var again = h("button", { class: "danger", type: "button", text: resetArmed ? "本当にやり直す(押すと得点が消えます)" : "同じ問題でやり直す" });
      again.addEventListener("click", function () {
        if (!resetArmed) { resetArmed = true; again.textContent = "本当にやり直す(押すと得点が消えます)"; return; }
        again.disabled = true; resetArmed = false;
        var jobs = S.answers.map(function (a) { return function () { return db.doc("answers/" + a.id).delete(); }; });
        jobs.reduce(function (p, f) { return p.then(f); }, Promise.resolve())
          .then(function () { return setState({ phase: "collect", order: [], idx: 0 }); })
          .catch(function () { toast("やり直しに失敗しました"); again.disabled = false; });
      });
      parts.push(hostBox([again]));
    }
    $("#app").replaceChildren.apply($("#app"), parts);
  }

  // ---------- 全体の描画 ----------
  var CHIPS = { collect: "問題を集めています", question: "出題中", reveal: "答え合わせ", final: "結果発表" };
  var queued = false;
  function render() {
    if (queued) return; queued = true;
    requestAnimationFrame(function () { queued = false; draw(); });
  }
  function draw() {
    var ph = S.state.phase;
    $("#phaseChip").textContent = CHIPS[ph] || "準備中";
    $("#who").textContent = myName ? "参加者: " + myName + (isHost ? "(司会)" : "") : "";
    $("#notice").replaceChildren(canWrite ? [] : h("p", { class: "warn", text: "このリンクでは見るだけの権限です。参加するには、主催者に共有を「コントリビューター」以上にしてもらってください。" }));
    if (!myName) { if (mounted !== "name") mountName(); return; }
    if (ph === "collect") {
      if (mounted !== "collect") mountCollect();
      fillCollect();
    } else {
      mounted = ph;
      if (ph === "question") viewQuestion(false);
      else if (ph === "reveal") viewQuestion(true);
      else viewFinal();
    }
    if (ph !== "final") resetArmed = false;
  }

  // ---------- 起動 ----------
  var gotAny = false, registering = false;
  function start() {
    var wait = setTimeout(function () { if (!gotAny) toast("つながるまで時間がかかっています…"); }, 10000);
    function onErr() { clearTimeout(wait); $("#app").replaceChildren(h("div", { class: "card" }, h("p", { text: "データにつながりませんでした。ページを開き直してください。" }))); }
    function mark() { gotAny = true; clearTimeout(wait); }
    function coll(name, key, map) {
      db.collection(name).onSnapshot(function (snap) {
        mark();
        S[key] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        if (key === "questions") S.questions.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
        if (key === "players" && myName && !registering && canWrite && !S.players.some(function (p) { return p.id === pid; })) {
          registering = true;
          db.doc("players/" + pid).set({ name: myName, at: Date.now() }).catch(function () {}).then(function () { registering = false; });
        }
        render();
      }, onErr);
    }
    stateDoc().onSnapshot(function (snap) {
      mark();
      var d = snap.exists ? snap.data() : null;
      S.state = d ? { phase: d.phase || "collect", order: d.order || [], idx: d.idx || 0 } : DEFAULT_STATE;
      render();
    }, onErr);
    coll("questions", "questions");
    coll("players", "players");
    coll("answers", "answers");
  }

  var c = window.claude;
  if (!c || !c.use) { $("#app").replaceChildren(h("div", { class: "card" }, h("p", { text: "このページはClaudeの画面で開いてください。" }))); return; }
  Promise.all([c.use("db"), c.use("user")]).then(function (r) {
    db = r[0];
    if (!db) { $("#app").replaceChildren(h("div", { class: "card" }, h("p", { text: "サインインしてから開き直してください。" }))); return; }
    var user = r[1];
    return Promise.all([user ? user.canEdit() : false, user ? user.can("data.write") : null]).then(function (v) {
      isHost = !!v[0]; canWrite = v[1] !== false;
      start();
    });
  });
})();
</script>
